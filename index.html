    <div id="app"><div class="boot" aria-hidden="true">lanyard<b>.</b></div></div>
    <style>
      /* Shown until the app has drawn its first page, so nobody stares at a blank screen.

      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 700 28px/1 system-ui, sans-serif; letter-spacing: -.02em;
              background: #f4f1ea; color: #15130f; border-top: 6px solid #D9502B; }
      .boot b { color: #D9502B; }
      @media (prefers-color-scheme: dark) { .boot { background: #141311; color: #f4f1ea; } }
