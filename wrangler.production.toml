# Production deployment config. Deploy with:
#   npm run build && npx wrangler deploy --config wrangler.production.toml
# Local dev continues to use wrangler.toml (localhost origins).
name = "lanyard-v2"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist", binding = "ASSETS", run_worker_first = true, not_found_handling = "single-page-application" }

[[d1_databases]]
binding = "DB"
database_name = "lanyard_db"
database_id = "cbee0cf7-5fff-477c-87dc-92a655eb72a0"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lanyard-media"

[[kv_namespaces]]
binding = "LANYARD_KV"
id = "6fa2750047f94df78dc7814bd56b17b7"

# Daily retention purge (selfies > 12 months, feedback text > 12 months,
# expired codes/sessions, stale guests). Required by the Privacy Policy.
[triggers]
crons = ["17 3 * * *", "47 * * * *"]

[vars]
# Every address the app may be used from (comma-separated). host.lanyd.fyi is
# the host portal (F10): only /api/host/* is served there, and the attendee API
# does not accept its origin (worker/security.js).
APP_ORIGIN = "https://lanyd.fyi,https://www.lanyd.fyi,https://lanyard-v2.musea-moderation.workers.dev,https://host.lanyd.fyi"
# The host portal's address, for host email links and the /host -> host site 301s.
# Needs the custom domain host.lanyd.fyi on this Worker (owner step, F10 plan note).
HOST_ORIGIN = "https://host.lanyd.fyi"
# Passkeys made on the old workers.dev address stay tied to RP_ID. Anything
# served from RP_DOMAIN (and its subdomains) uses RP_DOMAIN instead.
RP_DOMAIN = "lanyd.fyi"
RP_ID = "lanyard-v2.musea-moderation.workers.dev"
